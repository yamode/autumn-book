# main への push で Cloudflare Pages へ自動デプロイ（Direct Upload + wrangler）
# 必要な Secrets: CLOUDFLARE_API_TOKEN（Pages 編集権限）/ CLOUDFLARE_ACCOUNT_ID
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false # デプロイは順番に流す（途中キャンセルで中途半端な状態を作らない）

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler pages deploy --branch main

      - name: Health check（本番反映の確認）
        run: |
          sleep 10
          # 503 はメンテナンスモード有効時の正常応答として許容（正式公開前の lockdown 期間でも CI を通す）
          for path in / /yamado/nishiwaga /yamado/oga /yamado/oga/onsen /search; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://autumn-book.pages.dev$path")
            echo "$code $path"
            if [ "$code" != "200" ] && [ "$code" != "503" ]; then
              echo "::error::Health check failed: $path returned $code"
              exit 1
            fi
          done
