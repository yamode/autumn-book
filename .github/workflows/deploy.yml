# main への push で Cloudflare Pages へ自動デプロイ（Direct Upload + wrangler）
# 必要な Secrets: CLOUDFLARE_API_TOKEN（Pages 編集権限）/ CLOUDFLARE_ACCOUNT_ID / LIVE_SESSION_SECRET（Autumn Live・無ければ飛ばす）
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false # デプロイは順番に流す（途中キャンセルで中途半端な状態を作らない）

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Autumn Live の入場券の署名鍵（docs/autumn-live.md §4.4）。GitHub の secret を Pages のシークレットへ写す。
      # Pages のシークレットは次のデプロイから効くので、デプロイの前に置く。値はログに出さない（標準入力で渡す）
      - name: Sync LIVE_SESSION_SECRET to Cloudflare Pages
        # 失敗しても本体のデプロイは止めない（Live の入場の口が 503 のままになるだけ）
        continue-on-error: true
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_SESSION_SECRET: ${{ secrets.LIVE_SESSION_SECRET }}
        run: |
          if [ -z "$LIVE_SESSION_SECRET" ]; then echo "LIVE_SESSION_SECRET is not set; skipping"; exit 0; fi
          printf '%s' "$LIVE_SESSION_SECRET" | pnpm dlx wrangler pages secret put LIVE_SESSION_SECRET --project-name autumn-book

      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler pages deploy --branch main

      - name: Deploy member rank preview
        working-directory: apps/web/member-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler pages deploy --branch main

      - name: Health check（本番反映の確認）
        run: |
          sleep 10
          base=https://book.yamado.app
          status_of() {
            curl -sS --max-time 15 -o /dev/null -w "%{http_code}" "$1"
          }
          check_public() {
            local path="$1" code
            code=$(status_of "$base$path")
            echo "$code $path"
            # メンテナンスモード中の 503 は正常
            case "$code" in
              200|503) ;;
              *) echo "::error::Health check failed: $path returned $code"; return 1 ;;
            esac
          }
          check_facility_page() {
            local path="$1" target="$2" response
            response=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code} %{redirect_url}" "$base$path")
            echo "$path: $response"
            # 施設ページが公開中は 200、非公開の間はその施設のプラン一覧への 302
            case "$response" in
              "200 "|"503 "|"302 $base$target") ;;
              *) echo "::error::Health check failed: unexpected response for $path ($response)"; return 1 ;;
            esac
          }
          check_public /
          check_public /search
          check_facility_page /yamado/nishiwaga /yamado/nishiwaga/plans
          check_facility_page /yamado/oga /yamado/oga/plans
          check_facility_page /yamado/oga/onsen /yamado/oga/plans
          check_public /yamado/nishiwaga/plans
          check_public /yamado/oga/plans
          # Autumn Live はブラウザからは入れない（入場券が無ければ 403）
          code=$(status_of "$base/live")
          if [ "$code" != "403" ]; then
            echo "::error::/live must be 403 without a Live pass (returned $code)"
            exit 1
          fi
          code=$(status_of https://autumn-book-member-preview.pages.dev/account)
          if [ "$code" != "303" ]; then
            echo "::error::Member preview must redirect visitors without a preview session (returned $code)"
            exit 1
          fi
