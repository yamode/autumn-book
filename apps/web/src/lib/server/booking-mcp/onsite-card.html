<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>山人の現地払い予約</title>
	<style>
		:root { color-scheme: light dark; font: 15px/1.55 system-ui, sans-serif; }
		body { margin: 0; padding: 1rem; color: var(--color-text-primary, CanvasText); background: var(--color-background-primary, Canvas); }
		h1 { font-size: 1.15rem; margin: 0 0 .5rem; }
		dl { display: grid; grid-template-columns: auto 1fr; gap: .35rem 1rem; margin: .6rem 0; }
		dd { margin: 0; overflow-wrap: anywhere; }
		label { display: block; margin: .65rem 0; }
		select, input:not([type=checkbox]), button { font: inherit; padding: .35rem .5rem; border-radius: .4rem; max-width: 100%; }
		a { color: var(--color-text-info, LinkText); }
		#confirm { background: #315343; border: 1px solid #315343; color: white; cursor: pointer; }
		#confirm:disabled { opacity: .65; cursor: default; }
		#receipt { font-weight: 700; font-size: 1.2rem; }
		#policy { white-space: pre-line; }
		[hidden], label:has([hidden]) { display: none !important; }
	</style>
</head>
<body>
	<main>
		<h1>山人の現地払い予約</h1>
		<p id="status" role="status" aria-live="polite">予約内容を読み込んでいます…</p>
		<p id="receipt" hidden></p>
		<section id="summary" hidden aria-label="予約内容">
			<dl id="details"></dl>
			<p><strong>取消条件</strong><br><span id="policy"></span></p>
			<form id="booking">
				<label>現地でのお支払い方法 <select name="onsiteMethod" required></select></label>
				<label><span id="arrivalLabel"></span> <select name="arrival"></select></label>
				<label><span id="transportLabel"></span> <select name="transport"></select></label>
				<label>交通手段の詳細 <input name="transportOther" maxlength="60" hidden></label>
				<label><span id="pickupLabel"></span> <select name="pickup" hidden></select></label>
				<label>男性の人数 <select name="male" hidden></select> <span id="gender"></span></label>
				<p id="deadline"></p>
				<label><input name="agreed" type="checkbox" required> 予約内容・料金・取消条件と<a id="terms" target="_blank" rel="noreferrer">宿泊約款</a>を確認し、現地払いでの予約に同意する</label>
				<button id="confirm" type="button">現地払いで予約を確定する</button>
			</form>
		</section>
		<p id="book" hidden><a id="bookLink" target="_blank" rel="noreferrer">山人Bookで手続きする</a></p>
	</main>
	<!-- client -->
</body>
</html>
